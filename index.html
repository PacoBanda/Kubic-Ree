<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kubicar Web</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <div class="slider-container" id="slider">
        
        <section class="slide">
            <div class="card">
                <h2>AVANCE</h2>
                <div class="input-grid">
                    <div class="input-group">
                        <label>L. Izquierda</label>
                        <input type="number" id="av_lI" placeholder="0.0">
                    </div>
                    <div class="input-group">
                        <label>L. Derecha</label>
                        <input type="number" id="av_lD" placeholder="0.0">
                    </div>
                </div>
                
                <label>Alturas (h1 - h6)</label>
                <div class="input-grid heights">
                    <input type="number" id="av_h1" placeholder="h1">
                    <input type="number" id="av_h2" placeholder="h2">
                    <input type="number" id="av_h3" placeholder="h3">
                </div>
                <div class="input-grid heights">
                    <input type="number" id="av_h4" placeholder="h4">
                    <input type="number" id="av_h5" placeholder="h5">
                    <input type="number" id="av_h6" placeholder="h6">
                </div>

                <button onclick="calcAvance()">CALCULAR AVANCE</button>
                <div class="result" id="res_avance">0 Tn</div>

                <div class="image-footer">
                    <img src="img/Avance.svg" alt="Esquema Avance">
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="card">
                <h2>REBAJE</h2>
                <div class="input-grid">
                    <div class="input-group">
                        <label>L. Izquierda</label>
                        <input type="number" id="re_lI" placeholder="0.0">
                    </div>
                    <div class="input-group">
                        <label>L. Derecha</label>
                        <input type="number" id="re_lD" placeholder="0.0">
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn-firme" onclick="calcRebaje(2.0)">FIRME (2.0)</button>
                    <button class="btn-relleno" onclick="calcRebaje(1.68)">RELLENO (1.68)</button>
                </div>
                <div class="result" id="res_rebaje">0 Tn</div>

                <div class="image-footer">
                    <img src="img/ReAlceBaje.svg" alt="Esquema Rebaje">
                </div>
            </div>
        </section>

        <section class="slide">
            <div class="card">
                <h2>RECORTE</h2>
                <div class="input-group">
                    <label>Ancho (m)</label>
                    <input type="number" id="rec_anch" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Longitud (m)</label>
                    <input type="number" id="rec_lng" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Altura (m)</label>
                    <input type="number" id="rec_alt" value="2.5">
                </div>
                <button onclick="calcRecorte()">CALCULAR RECORTE</button>
                <div class="result" id="res_recorte">0 Tn</div>

                <div class="image-footer">
                    <img src="img/Recorte.svg" alt="Esquema Recorte">
                </div>
            </div>
        </section>

    </div>

    <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script src="./JS/script.js"></script>
</body>
</html>
