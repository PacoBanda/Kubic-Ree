<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculador de Rebaje Pro</title>
    <link rel="stylesheet" href="./CSS/rebaje.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Control de Rebaje</h3>
            <div class="grid-inputs">
                <div class="field">
                    <label style="color: #ff9f43;">Long. Der. (m)</label>
                    <input type="number" id="longDer" min="0" value="15" step="0.1">
                </div>
                <div class="field">
                    <label style="color: #a29bfe;">Long. Izq (m)</label>
                    <input type="number" id="longIzq" value="12" step="0.1">
                </div>
            </div>
            <hr>
            <div class="grid-inputs">
                <div class="field"><label>Alt. Inicial</label><input type="number" id="hInicial" value="0.0" step="0.1"></div>
                <div class="field"><label>Alt. 1</label><input type="number" id="hInter1" value="1.0" step="0.1"></div>
                <div class="field"><label>Alt. 2</label><input type="number" id="hInter2" value="2.0" step="0.1"></div>
                <div class="field"><label>Alt. Final</label><input type="number" id="hFinal" value="3.5" step="0.1"></div>
            </div>
            <hr>
            <div class="field">
                <label>Ancho Base (m)</label>
                <input type="number" id="wBase" value="8.5" step="0.1">
            </div>
            <div class="field">
                <label>Tipo de Material</label>
                <div class="material-group">
                    <button type="button" class="mat-btn active" data-val="2.0">FIRME</button>
                    <button type="button" class="mat-btn" data-val="1.8">RELLENO</button>
                </div>
                <input type="hidden" id="tipoMaterial" value="2.0">
            </div>
            <div class="result-box">
                <label>Masa Total:</label>
                <div class="vol-val"><span id="resMasa">0</span> <small>Ton</small></div>
                <div id="resPendiente" class="info-pend">Pendiente: 0%</div>
            </div>
        </div>
        <div class="main-view">
            <div class="card">
                <small>VISTA ISOMÉTRICA (3D)</small>
                <canvas id="canvas3D"></canvas>
            </div>
            <div class="card">
                <small>PLANTA SUPERIOR (CENITAL)</small>
                <canvas id="canvasPlanta"></canvas>
            </div>
        </div>
    </div>
    <script src="./JS/rebajes.js"></script>
</body>
</html>
